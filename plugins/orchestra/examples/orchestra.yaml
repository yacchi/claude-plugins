# orchestra configuration
#
# Copy this file to one of:
#   .claude/orchestra.yaml        (project scope — checked into the repo, shared with the team)
#   .claude/orchestra.local.yaml  (project-local scope — this repo, this developer only; never
#                                  commit it. Mirrors Claude Code's own settings.json/
#                                  settings.local.json split. Add it to the repo's .gitignore.)
#   ~/.claude/orchestra.yaml      (user scope — personal default across all projects)
#
# `.yml` is also recognized as an alias for `.yaml` at any of the three scopes.
#
# Effective config = deep-merge(built-in defaults, user config, project config, project-local
# config), in that order — later layers win key-by-key. Each file only needs to name the keys
# it wants to override; everything else is inherited from the previous layer (or the built-in
# defaults below if nothing else sets it). See the `run` skill's SKILL.md §9 for the exact
# algorithm and `setup` for a skill that can author this file for you interactively (detects
# Codex/Copilot, asks which scope to write to, edits in place, and offers to gitignore
# project-local files).
#
# Example project override that changes nothing except turning Copilot back OFF for
# this repo (it ships `enabled: true` by default as of v0.11.0 - see below; every
# candidate is still gated on real availability by `agent-exec route`, so this is
# only needed to opt out entirely, e.g. on a machine that must never shell out):
#
#   external_executors:
#     copilot:
#       enabled: false

# Capability/performance classes and verification roles, each mapped to a Claude
# model alias (or full model ID). The implementation classes (light/standard/deep)
# describe how hard the work is; the review role names the verification function.
# Both live here so the whole tier vocabulary is in one place. Used wherever the
# run skill routes work by class/role.
tiers:
  # implementation capability classes (cheapest/fastest -> hardest)
  light: haiku       # fast, mechanical, fully-specified work
  standard: sonnet   # normal implementation with modest design latitude
  deep: opus         # design-sensitive / hard problems needing real judgment
  # verification role
  review: sonnet     # mandatory same-run adversarial review of the work
  # `independent-review` has no built-in Claude model on purpose — it exists to
  # add a DIFFERENT provider's eyes; see `priority.independent-review` below.

# Non-Claude executors (Codex, Copilot, ...) that may be woven into the pipeline.
# Only entries with `enabled: true` are used.
external_executors:
  codex:
    enabled: true
    # `dispatch: cli` is the default as of v0.27.0: direct `codex exec`/`codex
    # exec resume <SESSION_ID>` invocation, same shape as copilot/opencode
    # below — this replaced the old `dispatch: agent` (via `codex:codex-rescue`)
    # default because the CLI takes an explicit session UUID (the rescue
    # agent's only continuation, `--resume-last`, grabs the wrong session
    # under parallel tasks) and reports session id + token usage inline
    # instead of needing post-hoc rollout-file scanning. `dispatch: agent` +
    # `agent_type: codex:codex-rescue` remains a fully supported override —
    # see run skill references/external-executors.md §1.
    dispatch: cli
    command: >-
      agent-exec codex exec --json --model {model} --config model_reasoning_effort={effort}
      --sandbox workspace-write --output-last-message {outfile} --cd {workdir} < {promptfile}
    resume_command: >-
      agent-exec codex exec resume {session_id} --json --model {model} --config model_reasoning_effort={effort}
      --sandbox workspace-write --output-last-message {outfile} --cd {workdir} < {promptfile}
    classes:
      - standard
      - deep
      - review
    class_policy:
      standard:
        model: gpt-5.6-luna
        effort: medium
      deep:
        model: gpt-5.6-sol
        effort: xhigh
      review:
        model: gpt-5.6-sol
        effort: low
    # Escalate a nominally light/standard-class task to `deep` when it needs deep
    # traversal of a large repo — Luna's long-context recall is measurably weak.
    long_context_escalation:
      when: task requires deep traversal of a large repo (Luna's long-context recall is weak)
      class: deep

  copilot:
    enabled: true
    dispatch: cli
    # Dispatched through the `agent-exec` wrapper (see `agent-exec install`).
    # Measured on Copilot CLI 1.0.74: `copilot -p` runs file-write/shell/network
    # tool calls autonomously in non-interactive mode with just --add-dir +
    # --output-format json — no allow-all flag/env var needed for headless
    # dispatch, so agent-exec no longer injects COPILOT_ALLOW_ALL and none is
    # needed in settings.json. --disable-builtin-mcps is a hardening default
    # (drops the github-mcp-server/customize-cloud-agent builtin MCP tools,
    # cuts token/latency). The only permission rule required is
    # `Bash(agent-exec:*)`; /setup offers to add it. NOTE: Copilot's own
    # tool-permission flags (--allow-tool/--deny-tool/--excluded-tools) are
    # NOT a security boundary — the agent has been observed rerouting a
    # denied tool call through a different tool. Real containment needs an
    # external OS sandbox (container/sandbox-exec/restricted user/egress
    # control/disposable worktree) — future work, not implemented here. See
    # run skill references/external-executors.md §2 for details and the
    # manual permission-only setup for users who don't install agent-exec.
    command: >-
      agent-exec copilot -p {promptfile} --model {model} --effort {effort}
      --add-dir {workdir} --output-format json --disable-builtin-mcps
    resume_command: >-
      agent-exec copilot --resume={session_id} -p {promptfile} --model {model} --effort {effort}
      --add-dir {workdir} --output-format json --disable-builtin-mcps
    classes:
      - light
      - standard
    class_policy:
      light:
        model: gpt-5.6-luna
        effort: medium
      standard:
        model: gpt-5.6-luna
        effort: medium

  # opencode reaches the SAME Copilot-billed models through one interface, and
  # is the only executor that reports a dollar cost directly: `run --format
  # json` emits tokens (input/output/reasoning/cache) plus `cost`, which
  # agent-exec stores as integer micro-USD in the run ledger. It is preferred
  # AHEAD of copilot for the implementation bands: measured on an identical
  # task, quality and wall-clock tied while opencode processed about a third
  # of copilot's fresh input tokens. Note the
  # `provider/model` form of `model` — a bare model id will not resolve.
  # v1 (`opencode`) only; v2 ships as a separate `opencode2` binary whose
  # plugin/server APIs are still in beta. See run skill
  # references/external-executors.md §7.
  opencode:
    enabled: true
    dispatch: cli
    classes:
      - light
      - standard
    class_policy:
      light:
        model: github-copilot/gpt-5.6-luna
        effort: medium
      standard:
        model: github-copilot/gpt-5.6-luna
        effort: medium

# Ordered executor preference per class/role (and, for the implementation classes,
# per task archetype) — this list is still the single source of truth for
# preference order, but the WALK ITSELF is executed by `agent-exec route` /
# `agent-exec dispatch`, not by the instructor reading this list by hand. `route`
# tries candidates left-to-right and drops to the NEXT one on a *reactive fallback
# signal*: the current executor is unavailable — NOT the task failing. "Unavailable"
# = hit a rate-limit / usage-window cap (Claude, Codex), ran out of AI credits /
# premium requests (Copilot), is `enabled: false`, its agent/CLI did not resolve in
# this environment, or the caller passed it in `--exhausted`. A task that RUNS but
# returns a wrong result is NOT a fallback signal — that stays on the SAME executor
# and goes through the normal review/retry loop.
#
# Entries are an `external_executors` key (`codex`, `copilot`, `opencode`, ...) or the sentinel
# `claude` (the built-in `tiers.<name>` model). An executor named here must have a
# matching `class_policy.<class>` on its `external_executors` block, or `route`
# skips it as misconfigured. Once `route`/`dispatch` finds an executor unavailable
# during a run, the instructor's only job is to keep passing it in `--exhausted` on
# every later call so it stays skipped for the rest of THAT run (sticky exhaustion)
# — `route` never re-probes it on its own.
#
# Each key's value is a mapping of task-archetype -> ordered list; `default` is the
# catch-all. `light` additionally recognizes `investigation` (read-only exploration
# / research fan-out, no review loop) as distinct from `default` (file-changing
# implementation that goes through the review/retry loop). Other keys normally only
# need `default`.
#
# Omit `priority` entirely to keep the legacy behavior: the Claude `tiers.<name>`
# model, with external executors woven in ad hoc per their own `classes` list.
# Opt-in, anonymized telemetry. Default OFF. When enabled, `agent-exec run
# --capture` self-logs one sanitized `dispatch` record per dispatch, and the
# instructor emits one `run_summary` record per orchestration (via a cheap
# haiku relay, never the instructor itself). Redaction is enforced by an
# ALLOWLIST inside `agent-exec` itself, not by trusting callers — only
# enumerated categorical values and non-negative integers can ever be stored,
# so it is structurally impossible for a telemetry record to contain prompts,
# task text, file paths, task ids, summaries, code, or error text. See the
# `run` skill's SKILL.md §10 for the full field list and `agent-exec telemetry
# show|archive|clear`. Toggle with `agent-exec telemetry enable/disable [--scope
# user|project|local]` instead of hand-editing.
telemetry:
  enabled: false
  dir: ~/.claude/orchestra/telemetry

# Persisted, time-decaying executor cooldown. Entries are written automatically
# when `agent-exec run --capture` or `agent-exec dispatch` parses
# `status: unavailable`; routing loads active entries as an additional candidate
# gate. `0` means no cooldown.
cooldown:
  enabled: true
  path: ~/.claude/orchestra/executor-state.json
  seconds:
    rate-limit: 900
    quota: 3600
    credits: 3600
    auth: 0
    nonzero-exit: 0

priority:
  light:
    # Copilot gpt-5.6-luna/medium first — the fastest+cheapest validated executor
    # for the light band (and for investigation fan-out). copilot ships
    # `enabled: true` above, so this actually prefers it whenever `agent-exec
    # route` finds it ready; only drops to claude on a genuine unavailable signal.
    investigation: [opencode, copilot, claude]
    default: [opencode, copilot, claude]
  standard:
    # luna clears sonnet-class work too, so it also leads the standard band.
    default: [opencode, copilot, claude, codex]
  deep:
    default: [claude, codex]
  review:
    default: [claude]
  independent-review:
    default: [codex]

# Opt-in guardrail against defaulting to a direct Claude Haiku implementer when a
# ready external executor exists — a NUDGE WITH A GUARANTEED ESCAPE, never a hard
# wall. NOTE: quote the value ("off"/"block") - YAML 1.1 (what PyYAML's
# safe_load implements) parses a bareword `off` as boolean False, not a string.
# When `light_class: "block"`, a PreToolUse hook (`hooks/enforce-router.sh`)
# fires only on a GENERIC Claude implementer call (no `subagent_type` at all,
# or `subagent_type` in general-purpose/claude, at a Haiku-class model) while
# `agent-exec route --class light` reports a non-claude executor ready.
# Naming any OTHER specific `subagent_type` is itself a carve-out: the Agent
# tool has no per-call tool-restriction params (its schema is only
# description/isolation/model/prompt/run_in_background/subagent_type), so a
# named agent is how tool access and a specialized system prompt get pinned,
# and Copilot can't substitute for either - `orchestra:orchestra-light` stays
# a deny target, since redirecting it to `agent-exec dispatch` is the point.
# Escape hatches: (1) a HARD CAP of one deny per session, full stop - after
# the first nudge the hook goes inert for the rest of the session regardless
# of prompt content (this plugin's own retry convention appends new feedback
# text every round, so a prompt-keyed fingerprint would just re-deny every
# round; the bound is session-wide instead), (2) an explicit
# `[orchestra:allow-claude: <reason>]` marker anywhere in the prompt/description,
# (3) the named-subagent_type carve-out above, and (4) ORCHESTRA_ENFORCEMENT=off
# plus fail-open on any uncertainty. Ships "off"; see `run` skill's SKILL.md §9.
#
# worker_vcs (default "block", i.e. ON): deny destructive VCS commands
# (checkout -- / restore / reset --hard / clean -f / stash push) when they come
# from a SUBAGENT and target a tree that is not one of orchestra's own
# (orchestra/* branch). `git stash` push/pop/apply/drop is denied even inside
# orchestra's own worktrees: refs/stash is ONE stack shared by every worktree,
# and parallel workers popping it have swapped each other's changes. Workers
# use `agent-exec shelf push`/`pop` instead: same job, stored per worktree. This one ships on because it prevents data loss, not
# because it steers a cost decision: worker prompts carrying three escalating
# generations of "never run git reset" still produced 35 such commands across
# seven weeks of transcripts. The main thread is never affected, a worker
# inside its own worktree is never affected, orchestra-delegate (which owns
# snapshots and rollbacks) is exempt, and heredoc/quoted text that merely
# mentions the commands is not mistaken for running them. Escapes:
# `[orchestra:allow-vcs: <reason>]` in the command or description, and
# ORCHESTRA_VCS_GUARD=off. Set to "off" here to disable entirely.
#
# worktree_lease (default "block", i.e. ON): one writing subagent per linked
# worktree at a time. The first subagent to write into a worktree takes its
# lease; a DIFFERENT subagent writing there while the holder was active within
# worktree_lease_window seconds (default 120) is denied. A SubagentStop hook
# releases the lease, so back-to-back rounds are never blocked. Exists because
# a message to a running workflow agent once resumed a copy of it and both
# committed into the same worktree. The main worktree, the main thread, and
# orchestra-delegate are never affected. Escapes: `[orchestra:allow-lease:
# <reason>]` and ORCHESTRA_LEASE_GUARD=off.
#
# turn_edits (default 8, or "off"): once the MAIN THREAD has hand-edited this
# many files inside one turn, a PostToolUse hook asks it once to re-classify
# into the orchestrated lane. It never blocks an edit. Turn-level analysis
# found orchestra invoked in 1 of 102 turns that hand-edited 10+ files -- the
# prompts that produce those turns ("作業を続けて", "実装して", "y") look small
# when classified and only reveal their size once work is underway. Subagent
# edits are not counted. ORCHESTRA_TURN_GUARD=off disables it.
#
# session_cleanup (default "on"): removes the finishing session's orchestra
# worktrees at SessionEnd, keeping any that still hold uncollected changes.
# Values are the strings "on" (default) or "off"; an unrecognized value falls
# back to "on". ORCHESTRA_SESSION_CLEANUP=off disables it regardless of this
# config value.
enforcement:
  light_class: "off"
  worker_vcs: "block"
  worktree_lease: "block"
  worktree_lease_window: 120
  turn_edits: 8
  session_cleanup: "on"

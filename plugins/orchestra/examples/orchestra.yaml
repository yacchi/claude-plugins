# orchestra configuration
#
# Copy this file to one of:
#   .claude/orchestra.yaml        (project scope — checked into the repo, shared with the team)
#   .claude/orchestra.local.yaml  (project-local scope — this repo, this developer only; never
#                                  commit it. Mirrors Claude Code's own settings.json/
#                                  settings.local.json split. Add it to the repo's .gitignore.)
#   ~/.claude/orchestra.yaml      (user scope — personal default across all projects)
#
# `.yml` is also recognized as an alias for `.yaml` at any of the three scopes.
#
# Effective config = deep-merge(built-in defaults, user config, project config, project-local
# config), in that order — later layers win key-by-key. Each file only needs to name the keys
# it wants to override; everything else is inherited from the previous layer (or the built-in
# defaults below if nothing else sets it). See the `run` skill's SKILL.md §9 for the exact
# algorithm and `setup` for a skill that can author this file for you interactively (detects
# pi, asks which scope to write to, edits in place, and offers to gitignore
# project-local files).
#
# Example project override that changes nothing except turning pi back OFF for
# this repo (it ships `enabled: true` by default as of v0.11.0 - see below; every
# candidate is still gated on real availability by `agent-exec route`, so this is
# only needed to opt out entirely, e.g. on a machine that must never shell out):
#
#   external_executors:
#     pi:
#       enabled: false

# Capability/performance classes and verification roles, each mapped to a Claude
# model alias (or full model ID). The implementation classes (light/standard/deep)
# describe how hard the work is; the review role names the verification function.
# Both live here so the whole tier vocabulary is in one place. Used wherever the
# run skill routes work by class/role.
tiers:
  # implementation capability classes (cheapest/fastest -> hardest)
  light: haiku       # fast, mechanical, fully-specified work
  standard: haiku    # normal implementation with modest design latitude
  deep: opus         # design-sensitive / hard problems needing real judgment
  # verification role
  review: sonnet     # mandatory same-run adversarial review of the work
  # `independent-review` has no built-in Claude model on purpose — it exists to
  # add a DIFFERENT provider's eyes; see `priority.independent-review` below.

# Non-Claude executors (pi, ...) that may be woven into the pipeline.
# Only entries with `enabled: true` are used.
external_executors:
  # pi is the CLI executor. agent-exec builds the whole invocation itself (no
  # `command` template here): `PI_SKIP_VERSION_CHECK=1 pi -p --mode json
  # --no-approve --no-extensions --no-skills --no-prompt-templates --no-themes
  # --model <provider/id> --thinking <effort> [--session <id>]`, prompt on
  # stdin, cwd = the worktree. `model` is always `provider/id`; a bare id will
  # not resolve. The `openai-codex/*` models run on the ChatGPT subscription,
  # and pi's reported `cost` there is a list-price estimate, NOT a charge. Metered providers such as
  # `github-copilot/*` report a real cost. An exit-0 run whose final message
  # has stopReason "error" is treated as a failure. Session resume uses
  # `--session`. See run skill references/external-executors.md.
  pi:
    enabled: true
    dispatch: cli
    # managed = orchestra's own pi agent dir (settings, models, AGENTS.md and
    # packages stay separate from the user's); user = pi's default
    # `~/.pi/agent`; or a path. See references/config.md §7.
    agent_dir: managed
    # false adds `--no-context-files` (no AGENTS.md / CLAUDE.md for workers).
    context_files: true
    classes:
      - light
      - standard
      - deep
      - independent-review
    class_policy:
      light:
        model: openai-codex/gpt-5.6-luna
        effort: medium
      standard:
        model: openai-codex/gpt-5.6-luna
        effort: medium
      deep:
        model: openai-codex/gpt-6.1-sol
        effort: high
      independent-review:
        model: openai-codex/gpt-6.1-sol
        effort: medium

# Executor binaries orchestra installs at a pinned version into its own state
# dir (`agent-exec tools status|install`); see references/config.md §6.
# Resolution per tool: source auto (managed when valid, else the system binary
# on PATH) | managed | system. Omit the section to use PATH binaries only.
# tools:
#   installer: auto        # auto (mise when on PATH, else npm) | mise | npm
#   pi:
#     source: auto
#     spec: "npm:@earendil-works/pi-coding-agent"
#     version: "1.2.0"     # bump here, then run `agent-exec tools install pi`
#     bin: pi
#   # Another executor binary can be pinned the same way under its own key
#   # (`spec` is `npm:<package>` or a mise backend spec, `bin` the executable
#   # name). A tool not pinned here runs from PATH.
# There is no update command: change `version`, then run
# `agent-exec tools install <name>` (add `--force` to reinstall the same version).


# Ordered executor preference per class/role (and, for the implementation classes,
# per task archetype) — this list is still the single source of truth for
# preference order, but the WALK ITSELF is executed by `agent-exec route` /
# `agent-exec dispatch`, not by the instructor reading this list by hand. `route`
# tries candidates left-to-right and drops to the NEXT one on a *reactive fallback
# signal*: the current executor is unavailable — NOT the task failing. "Unavailable"
# = hit a rate-limit / usage-window cap (Claude, pi), ran out of credits /
# quota (a metered pi provider), is `enabled: false`, its agent/CLI did not resolve in
# this environment, or the caller passed it in `--exhausted`. A task that RUNS but
# returns a wrong result is NOT a fallback signal — that stays on the SAME executor
# and goes through the normal review/retry loop.
#
# Entries are an `external_executors` key (`pi`, ...) or the sentinel
# `claude` (the built-in `tiers.<name>` model). An executor named here must have a
# matching `class_policy.<class>` on its `external_executors` block, or `route`
# skips it as misconfigured. Once `route`/`dispatch` finds an executor unavailable
# during a run, the instructor's only job is to keep passing it in `--exhausted` on
# every later call so it stays skipped for the rest of THAT run (sticky exhaustion)
# — `route` never re-probes it on its own.
#
# Each key's value is a mapping of task-archetype -> ordered list; `default` is the
# catch-all. `light` additionally recognizes `investigation` (read-only exploration
# / research fan-out, no review loop) as distinct from `default` (file-changing
# implementation that goes through the review/retry loop). Other keys normally only
# need `default`.
#
# Omit `priority` entirely to keep the legacy behavior: the Claude `tiers.<name>`
# model, with external executors woven in ad hoc per their own `classes` list.
# Opt-in, anonymized telemetry. Default OFF. When enabled, `agent-exec
# dispatch` self-logs one sanitized `dispatch` record per dispatch, and the
# instructor emits one `run_summary` record per orchestration (via a cheap
# haiku relay, never the instructor itself). Redaction is enforced by an
# ALLOWLIST inside `agent-exec` itself, not by trusting callers — only
# enumerated categorical values and non-negative integers can ever be stored,
# so it is structurally impossible for a telemetry record to contain prompts,
# task text, file paths, task ids, summaries, code, or error text. See the
# `run` skill's SKILL.md §10 for the full field list and `agent-exec telemetry
# show|archive|clear`. Toggle with `agent-exec telemetry enable/disable [--scope
# user|project|local]` instead of hand-editing.
telemetry:
  enabled: false
  dir: ~/.claude/orchestra/telemetry

# Persisted, time-decaying executor cooldown. Entries are written automatically
# when `agent-exec dispatch` parses
# `status: unavailable`; routing loads active entries as an additional candidate
# gate. `0` means no cooldown.
cooldown:
  enabled: true
  path: ~/.claude/orchestra/executor-state.json
  seconds:
    rate-limit: 900
    quota: 3600
    credits: 3600
    auth: 0
    nonzero-exit: 0
    sandbox: 0

# Usage-aware routing: before walking the priority list, route/dispatch read
# how much of the subscription behind each candidate's 5-hour and 7-day
# rate-limit windows is used (Claude plan for claude, ChatGPT plan for pi on
# openai-codex/... models; other providers have no data). A candidate at or
# above a threshold (percent) is demoted like a cooldown: soft, ignored when
# every candidate is over. Lookups are cached for cache_seconds in the state
# dir; every failure is fail-open. --no-usage skips it for one call;
# ORCHESTRA_USAGE_ROUTING=0 turns it off.
usage_routing:
  enabled: true
  thresholds:
    five_hour: 80
    seven_day: 90
  cache_seconds: 120

# OS sandbox for CLI executor children. `auto` uses the best backend available;
# `required` refuses to run without one; `off` never wraps. These two lists are
# UNIONED across config layers, so a project cannot silently remove an entry.
sandbox:
  mode: auto
  allow_write: []
  deny_read: []
  # Outbound allowlist for the herdr host (v0.50.0) and the CLI executor pi,
  # enforced by sandbox-runtime (tools.srt). Both lists are unioned across
  # layers; approve more at run time with
  # `agent-exec sandbox allow-domain <host> [--reason TEXT]`. mode: "off" =
  # unrestricted. A CLI executor additionally reaches its own
  # `external_executors.<name>.network_domains`.
  network:
    mode: allowlist
    # package-registry hosts from the tree's tracked files (package.json,
    # pyproject.toml, go.mod, Cargo.toml, ...; a tracked root .npmrc's registry)
    ecosystem: true
    allowed_domains: [api.anthropic.com]
    denied_domains: []
    # quiet_domains: blocked and audited but never listed as a denial to approve
    # (defaults: Claude/herdr background traffic such as mcp-proxy.anthropic.com)

# Runaway protection. The watchdog kills wall-clock, idle/tool-idle, or repeat
# runaway work and returns a structured `runaway` dispatch status.
watchdog:
  enabled: true
  idle_seconds: 600
  tool_idle_seconds: 900
  repeat_limit: 3
  wall_seconds:
    light: 1200
    standard: 2400
    deep: 5400
    independent-review: 2400

# Additional gitignored directory names (or relative paths, matched by
# basename) that `isolate create` should copy into a fresh worktree, on top
# of the built-in list (node_modules, .venv, venv, .tox, vendor, target,
# .next, .nuxt, .svelte-kit, .gradle, Pods, .bundle, .dart_tool). Use this for
# a gitignored build prerequisite the built-in list does not cover, so a
# worker does not have to rebuild it from scratch in every worktree.
isolation:
  carry_extra: []
  # carry_extra: [pkg]   # e.g. packages/core-wasm/pkg, a generated wasm package

# `agent-exec check` runs these config-declared lint/test commands over a
# tree's changed files (see `references/config.md` §4 for full semantics).
# `items` is a LIST: a higher config layer replaces it whole, it is never
# merged entry-by-entry, so a project's own check list never silently
# inherits a user-level one it never asked for.
checks:
  max_parallel: 2   # concurrent check commands machine-wide; 0 = unlimited
  retry_failed_alone: true
  flaky_threshold: 3
  ensure:
    - exists: "apps/web/node_modules"
      run: "pnpm install --frozen-lockfile"
  items: []
  # items:
  #   - name: lint
  #     phase: lint
  #     paths: ["apps/web/**"]           # always run when this workspace changed
  #     run: "pnpm exec biome check {files}"
  #     fix: "pnpm exec biome check --write {files}"   # optional, runs first,
  #     # exit code and output ignored -- a fixer is not a gate
  #     cwd: "web"             # optional, relative to the tree root, default "."
  #     timeout: 900           # optional seconds, default 1800
  #     junit: "reports/junit.xml"   # optional, relative to `cwd`
  #     retry_alone: "pnpm exec vitest run {failed}"
  #   - name: web-build
  #     phase: prepare
  #     paths: ["apps/web/**"]
  #     run: "pnpm --dir apps/web build"
  #   - name: typecheck
  #     paths: ["**/*.ts", "**/*.tsx"]
  #     run: "pnpm exec tsc --noEmit"
  #     cwd: "web"

# `agent-exec wave run` runs a package whose route resolves to a Claude tier
# (normally a `delegate` need for the instructor) in an interactive Claude
# Code session hosted by Orca, within the subscription (never `claude -p`),
# and keeps that session alive so self-verify and post-integration fixes go
# back to the session that wrote the code (see `references/config.md` §5).
# orca:
#   enabled: auto          # auto = when `orca` is on PATH and `orca status` is ok;
#                          # true = required (the run stops without it); false = never
#   command: "claude --model {model} --permission-mode acceptEdits"
#   models: {light: sonnet, standard: opus, deep: opus}   # when the route names no model
#   user_config: isolate   # isolate (default) = hosted Claude skips your MCP servers, user hooks and
#                          # user plugins; inherit = loads them
#   auto_trust: false      # true = accept Claude's folder-trust dialog, only for
#                          # worktrees the executor itself created
#   startup_timeout: 90    # seconds to reach the prompt box
#   task_timeout: 3600     # seconds per prompt before the package becomes a need
#   keep_sessions: true    # false = close the terminal after every prompt
#                          # (the worktree stays until integrated)
#
# Which interactive host runs those Claude-tier packages: auto (herdr when
# available, else Orca, else none) | herdr | orca | none. The backend's own
# `enabled` still applies. See references/config.md §8.
# interactive_host: auto
# herdr:                   # same job as `orca`, hosted by herdr
#   enabled: auto
#   args: "--model {model} --permission-mode {permission_mode}"   # after `--`
#   models: {light: sonnet, standard: opus, deep: opus}
#   permission_mode: auto  # (v0.49.0) Claude's classifier approves tool calls; acceptEdits stalls on every Bash dialog
#                          # (v0.50.0) bypassPermissions only under srt with the network allowlist enforced
#   user_config: isolate   # isolate | inherit, as for `orca`
#   auto_trust: true       # (v0.49.0) accept the folder-trust dialog, only for worktrees
#                          # orchestra created AND while the herdr server is sandboxed
#                          # (sandbox.mode off / no backend -> a `trust` need instead)
#   # orchestra runs its own herdr: XDG_CONFIG_HOME=<state dir>/hx (or
#   # /private/tmp/orchestra-<uid>/hx when that path is too long for a socket),
#   # server under the `sandbox` config (Seatbelt / bubblewrap), or under
#   # sandbox-runtime (srt) with `sandbox.network` as its domain allowlist.
#   startup_timeout: 90
#   task_timeout: 3600
#   idle_grace: 300        # (v0.61.0) idle with an unchanged screen and no result this long:
#                          # submit a prompt left in the input box (or resend it) once, then a need
#   keep_sessions: true
#   warm:                  # (v0.48.0) fork package sessions from one warm reader
#     enabled: true        # needs plan.json preamble-in-repo / warm_read files
#     ttl_seconds: 3000    # rebuild once the warm session is this stale
#     min_packages: 2      # packages on the same model before warm pays off

priority:
  light:
    # Claude Haiku 5.5 first - measured fastest for the light band and it runs
    # on the subscription; pi (Luna/medium) is the fallback on a genuine
    # unavailable signal.
    investigation: [claude, pi]
    default: [claude, pi]
  standard:
    # Claude Haiku 5.5 leads the standard band (round7 judgment benchmark 3/3 vs
    # Luna 1/3); pi Luna/medium is the fallback.
    default: [claude, pi]
  deep:
    default: [claude, pi]
  review:
    default: [claude]
  independent-review:
    default: [pi]

# Opt-in guardrail against defaulting to a direct Claude Haiku implementer when a
# ready external executor exists — a NUDGE WITH A GUARANTEED ESCAPE, never a hard
# wall. NOTE: quote the value ("off"/"block") so every YAML parser reads a
# string (a YAML 1.1 parser reads a bareword `off` as boolean False).
# When `light_class: "block"`, a PreToolUse hook (`hooks/guards/light-class.ts`)
# fires only on a GENERIC Claude implementer call (no `subagent_type` at all,
# or `subagent_type` in general-purpose/claude, at a Haiku-class model) while
# `agent-exec route --class light` reports a non-claude executor ready.
# Naming any OTHER specific `subagent_type` is itself a carve-out: the Agent
# tool has no per-call tool-restriction params (its schema is only
# description/isolation/model/prompt/run_in_background/subagent_type), so a
# named agent is how tool access and a specialized system prompt get pinned,
# and an external executor can't substitute for either - `orchestra:orchestra-light` stays
# a deny target, since redirecting it to `agent-exec dispatch` is the point.
# Escape hatches: (1) a HARD CAP of one deny per session, full stop - after
# the first nudge the hook goes inert for the rest of the session regardless
# of prompt content (this plugin's own retry convention appends new feedback
# text every round, so a prompt-keyed fingerprint would just re-deny every
# round; the bound is session-wide instead), (2) an explicit
# `[orchestra:allow-claude: <reason>]` marker anywhere in the prompt/description,
# (3) the named-subagent_type carve-out above, and (4) ORCHESTRA_ENFORCEMENT=off
# plus fail-open on any uncertainty. Ships "off"; see `run` skill's SKILL.md §9.
#
# worker_vcs (default "block", i.e. ON): deny destructive VCS commands
# (checkout -- / restore / reset --hard / clean -f / stash push) when they come
# from a SUBAGENT and target a tree that is not one of orchestra's own
# (orchestra/* branch). `git stash` push/pop/apply/drop is denied even inside
# orchestra's own worktrees: refs/stash is ONE stack shared by every worktree,
# and parallel workers popping it have swapped each other's changes. Workers
# use `agent-exec shelf push`/`pop` instead: same job, stored per worktree. This one ships on because it prevents data loss, not
# because it steers a cost decision: worker prompts carrying three escalating
# generations of "never run git reset" still produced 35 such commands across
# seven weeks of transcripts. The main thread is never affected, a worker
# inside its own worktree is never affected, orchestra-delegate (which owns
# snapshots and rollbacks) is exempt, and heredoc/quoted text that merely
# mentions the commands is not mistaken for running them. Escapes:
# `[orchestra:allow-vcs: <reason>]` in the command or description, and
# ORCHESTRA_VCS_GUARD=off. Set to "off" here to disable entirely.
#
# worktree_lease (default "block", i.e. ON): one writing subagent per linked
# worktree at a time. The first subagent to write into a worktree takes its
# lease; a DIFFERENT subagent writing there while the holder was active within
# worktree_lease_window seconds (default 120) is denied. A SubagentStop hook
# releases the lease, so back-to-back rounds are never blocked. Exists because
# a message to a running workflow agent once resumed a copy of it and both
# committed into the same worktree. The main worktree, the main thread, and
# orchestra-delegate are never affected. Escapes: `[orchestra:allow-lease:
# <reason>]` and ORCHESTRA_LEASE_GUARD=off.
#
# turn_edits (default 8, or "off"): once the MAIN THREAD has hand-edited this
# many files inside one turn, a PostToolUse hook asks it once to re-classify
# into the orchestrated lane. It never blocks an edit. Turn-level analysis
# found orchestra invoked in 1 of 102 turns that hand-edited 10+ files -- the
# prompts that produce those turns ("作業を続けて", "実装して", "y") look small
# when classified and only reveal their size once work is underway. Subagent
# edits are not counted. ORCHESTRA_TURN_GUARD=off disables it. A model that
# answers "I already hold the spec, staying EXPRESS" and keeps going is asked
# a second time at twice the threshold, and that second request says the
# exemption has expired (a 30-day review saw turns of up to 37 edits after the
# first nudge).
#
# opus_generalist (default "nudge", or "off"): the first time per session a
# general-purpose subagent would run on the instructor's own Opus/Fable model
# -- named `model: opus`, or `model` omitted, which inherits it -- a
# PreToolUse hook denies it once and says how to proceed: `model: "sonnet"`
# for read-only work, orchestra:run for anything that writes code. The retry
# is never blocked. Escapes: `[orchestra:allow-opus: <reason>]` in the
# description, ORCHESTRA_OPUS_NUDGE=off.
#
# session_cleanup (default "on"): removes the finishing session's orchestra
# worktrees at SessionEnd, keeping any that still hold uncollected changes.
# Values are the strings "on" (default) or "off"; an unrecognized value falls
# back to "on". ORCHESTRA_SESSION_CLEANUP=off disables it regardless of this
# config value.
enforcement:
  light_class: "off"
  worker_vcs: "block"
  worktree_lease: "block"
  worktree_lease_window: 120
  turn_edits: 8
  opus_generalist: "nudge"
  session_cleanup: "on"

# --- pricing (optional) ---------------------------------------------------------
# `agent-exec usage` estimates cost from a built-in list of Anthropic API prices
# (USD per 1M tokens). A model missing from that list is reported as unpriced, not
# guessed. Add or override prices here, matched by model-id prefix, longest first.
# cache_write_5m / cache_write_1h default to 1.25x / 2x of `input`; cache_read to
# 0.1x of `input`. The figure is an estimate from list prices, not an invoice.
# pricing:
#   models:
#     claude-opus-5-5: {input: 4, output: 20, cache_read: 0.2}

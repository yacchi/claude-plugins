# orchestra configuration
#
# Copy this file to one of:
#   .claude/orchestra.yaml        (project scope — checked into the repo, shared with the team)
#   .claude/orchestra.local.yaml  (project-local scope — this repo, this developer only; never
#                                  commit it. Mirrors Claude Code's own settings.json/
#                                  settings.local.json split. Add it to the repo's .gitignore.)
#   ~/.claude/orchestra.yaml      (user scope — personal default across all projects)
#
# `.yml` is also recognized as an alias for `.yaml` at any of the three scopes.
#
# Effective config = deep-merge(built-in defaults, user config, project config, project-local
# config), in that order — later layers win key-by-key. Each file only needs to name the keys
# it wants to override; everything else is inherited from the previous layer (or the built-in
# defaults below if nothing else sets it). See the `run` skill's SKILL.md §9 for the exact
# algorithm and `setup` for a skill that can author this file for you interactively (detects
# Codex/Copilot, asks which scope to write to, edits in place, and offers to gitignore
# project-local files).
#
# Example project override that changes nothing except turning Copilot on for this repo:
#
#   external_executors:
#     copilot:
#       enabled: true

# Model aliases (or full model IDs) used wherever the run skill says
# haiku/opus/sonnet for the respective role.
tiers:
  worker: haiku
  hard_worker: opus
  verifier: sonnet

# Non-Claude executors (Codex, Copilot, ...) that may be woven into the pipeline.
# Only entries with `enabled: true` are used.
external_executors:
  codex:
    enabled: true
    dispatch: agent
    agent_type: codex:codex-rescue
    roles:
      - worker
      - hard_worker
      - independent-verifier
    model_policy:
      worker:
        model: gpt-5.6-luna
        effort: medium
      hard_worker:
        model: gpt-5.6-sol
        effort: xhigh
      independent-verifier:
        model: gpt-5.6-sol
        effort: low
    # Escalate a nominally worker-tier task to hard_worker when it needs deep
    # traversal of a large repo — Luna's long-context recall is measurably weak.
    long_context_escalation:
      when: task requires deep traversal of a large repo (Luna's long-context recall is weak)
      model: gpt-5.6-sol
      effort: xhigh

  copilot:
    enabled: false
    dispatch: cli
    command: >-
      copilot -p {promptfile} --model {model} --effort {effort}
      --allow-all-tools --add-dir {workdir} --output-format json
    resume_command: >-
      copilot --resume={session_id} -p {promptfile} --model {model} --effort {effort}
      --allow-all-tools --add-dir {workdir} --output-format json
    roles:
      - worker
    model_policy:
      worker:
        model: gpt-5.6-luna
        effort: medium

# Ordered executor preference per role (and, for `worker`, per task archetype).
# The instructor tries candidates left-to-right and drops to the NEXT one on a
# *reactive fallback signal*: the current executor is unavailable — NOT the task
# failing. "Unavailable" = hit a rate-limit / usage-window cap (Claude, Codex),
# ran out of AI credits / premium requests (Copilot), is `enabled: false`, or
# its agent/CLI did not resolve in this environment. A task that RUNS but returns
# a wrong result is NOT a fallback signal — that stays on the SAME executor and
# goes through the normal verify/retry loop.
#
# Entries are an `external_executors` key (`codex`, `copilot`, ...) or the
# sentinel `claude` (the built-in `tiers.<role>` model). An executor named here
# must have a matching `model_policy.<role>` on its `external_executors` block,
# or it is skipped as misconfigured. Once an executor is found unavailable during
# a run it stays skipped for the rest of THAT run (sticky exhaustion) — do not
# re-probe it per task.
#
# Each role's value is a mapping of task-archetype -> ordered list; `default` is
# the catch-all. `worker` additionally recognizes `investigation` (read-only
# exploration / research fan-out, no verifier loop) as distinct from `default`
# (file-changing implementation that goes through the verify/retry loop). Other
# roles normally only need `default`.
#
# Omit `role_priority` entirely to keep the legacy behavior: the Claude
# `tiers.<role>` model, with external executors woven in ad hoc per their own
# `roles` list.
role_priority:
  worker:
    # Copilot gpt-5.6-luna/medium first — the fastest+cheapest validated worker
    # for investigation fan-out. NOTE: copilot ships `enabled: false` below, so
    # as-shipped this list effectively starts at codex; enable copilot to
    # actually prefer it (that skip IS the reactive fallback in action).
    investigation: [copilot, codex, claude]
    default: [claude, codex]
  hard_worker:
    default: [claude, codex]
  verifier:
    default: [claude]
  independent-verifier:
    default: [codex]

description: >
  the rule listed under deny (not allow), a non-list allow and broken settings do not count
platforms: [darwin]
setup:
  fakes: [pi]
  env:
    PATH: "<HOME>/.local/bin:<ROOT>/bin:/usr/bin:/bin"
  modes:
    ~/.local/bin/agent-exec: "0755"
  files:
    ~/.local/bin/agent-exec: |
      #!/bin/sh
      exec "/m/plugins/marketplaces/orchestra/tools/agent-exec" "$@"
    ~/.claude/settings.json: |
      {"permissions": {"deny": ["Bash(agent-exec:*)"], "allow": "Bash(agent-exec:*)"}}
    .claude/settings.json: |
      {not json
    .claude/settings.local.json: |
      ["Bash(agent-exec:*)"]
normalize_keys: [build]
steps:
  - argv: [doctor]

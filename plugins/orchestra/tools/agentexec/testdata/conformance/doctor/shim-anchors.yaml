description: >
  the shim target is classified marketplace-clone, cache or other
platforms: [darwin]
setup:
  fakes: [pi]
  env:
    PATH: "<HOME>/.local/bin:<ROOT>/bin:/usr/bin:/bin"
  modes:
    ~/.local/bin/agent-exec: "0755"
  files:
    ~/.local/bin/agent-exec: |
      #!/bin/sh
      exec "/p/plugins/cache/orchestra/1.0.0/tools/agent-exec" "$@"
    ~/.claude/settings.json: |
      {"permissions": {"allow": ["Bash(agent-exec:*)"]}}
steps:
  - argv: [doctor]
    go_swap: {golden: uv, got: build, keys: [binary, source_hash, go]}
  - argv: [doctor, --text]
    go_swap: {golden: uv, got: build, keys: [binary, source_hash, go]}

description: >
  ORCHESTRA_CONFIG_ROOT redirects the project layer
platforms: [darwin]
setup:
  fakes: [pi]
  env:
    ORCHESTRA_CONFIG_ROOT: "<WORK>/other"
  files:
    other/.claude/orchestra.yaml: |
      tiers:
        light: opus
normalize_keys: [build]
normalize_text:
  - pattern: '(?m)^build: .*$'
    replace: 'build: <BUILD>'
steps:
  - argv: [doctor]

description: >
  a broken config layer: resolved false, the error text, no executors, no
  route, defaults for the rest
platforms: [darwin]
normalize_keys: [error, build]
setup:
  fakes: [pi]
  files:
    .claude/orchestra.yaml: |
      tiers: [unclosed
normalize_text:
  - pattern: '(?m)^build: .*$'
    replace: 'build: <BUILD>'
steps:
  - argv: [doctor]
  - argv: [doctor, --text]

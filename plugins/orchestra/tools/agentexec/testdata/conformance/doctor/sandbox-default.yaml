description: >
  the sandbox section under the default (on) configuration
platforms: [darwin]
setup:
  keep_sandbox_default: true
  fakes: [pi]
  env:
    PATH: "<HOME>/.local/bin:<ROOT>/bin:/usr/bin:/bin"
  modes:
    ~/.local/bin/agent-exec: "0755"
  files:
    ~/.local/bin/agent-exec: |
      #!/bin/sh
      exec "/m/plugins/marketplaces/orchestra/tools/agent-exec" "$@"
    ~/.claude/settings.json: |
      {"permissions": {"allow": ["Bash(agent-exec:*)"]}}
normalize_keys: [build]
normalize_text:
  - pattern: '(?m)^build: .*$'
    replace: 'build: <BUILD>'
steps:
  - argv: [doctor]
  - argv: [doctor, --text]

description: >
  an active cooldown lowers the route preview and is listed
platforms: [darwin]
setup:
  fakes: [pi]
  env:
    PATH: "<HOME>/.local/bin:<ROOT>/bin:/usr/bin:/bin"
  modes:
    ~/.local/bin/agent-exec: "0755"
  files:
    ~/.local/bin/agent-exec: |
      #!/bin/sh
      exec "/m/plugins/marketplaces/orchestra/tools/agent-exec" "$@"
    ~/.claude/settings.json: |
      {"permissions": {"allow": ["Bash(agent-exec:*)"]}}
    .claude/orchestra.yaml: |
      cooldown:
        enabled: true
    ~/.claude/orchestra/executor-state.json: |
      {"pi": {"reason": "quota", "until": 4102444800.5}, "old": {"reason": "quota", "until": 1.5}}
steps:
  - argv: [doctor]
    go_swap: {golden: uv, got: build, keys: [binary, source_hash, go]}
  - argv: [doctor, --text]
    go_swap: {golden: uv, got: build, keys: [binary, source_hash, go]}

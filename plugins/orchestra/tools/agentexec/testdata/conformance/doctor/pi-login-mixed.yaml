description: >
  two providers, one ready one not: login map per provider
platforms: [darwin]
setup:
  env:
    PATH: "<HOME>/.local/bin:<HOME>/fakebin:<ROOT>/bin:/usr/bin:/bin"
  modes:
    ~/.local/bin/agent-exec: "0755"
    ~/fakebin/pi: "0755"
  files:
    ~/.local/bin/agent-exec: |
      #!/bin/sh
      exec "/m/plugins/marketplaces/orchestra/tools/agent-exec" "$@"
    ~/.claude/settings.json: |
      {"permissions": {"allow": ["Bash(agent-exec:*)"]}}
    ~/fakebin/pi: |
      #!/bin/sh
      case "$*" in
        *openai-codex*) echo '{"status": "ready"}'; exit 0;;
        *) echo 'noise'; echo '{"status": "not_ready"}'; exit 0;;
      esac
    .claude/orchestra.yaml: |
      external_executors:
        pi:
          class_policy:
            light: {model: "anthropic/claude-haiku", effort: low}
steps:
  - argv: [doctor]
    go_swap: {golden: uv, got: build, keys: [binary, source_hash, go]}

description: >
  usage argument errors are exit 2: a bad duration, run or session ids that
  escape their directory, an unknown source, conflicting scopes, an unknown
  option
steps:
  - argv: ["usage", "--since", "yesterday"]
  - argv: ["usage", "--run", "../x"]
  - argv: ["usage", "--session", ".."]
  - argv: ["usage", "--source", "nope"]
  - argv: ["usage", "--list-runs", "--since", "1h"]
  - argv: ["usage", "--run", "x", "--since", "1h"]
  - argv: ["usage", "--bogus"]

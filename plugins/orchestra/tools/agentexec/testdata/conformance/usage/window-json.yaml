steps:
  - argv: ["usage", "--all-projects", "--since", "2026-03-01T00:00:00Z"]
  - argv: ["usage", "--all-projects", "--json", "--since", "2026-03-01T00:00:00Z"]
  - argv: ["usage", "--all-projects", "--since", "2026-03-02T00:00:00Z"]
  - argv: ["usage", "--all-projects", "--since", "20260301"]
  - argv: ["usage", "--all-projects", "--since", "2026-03-01 10:00:00+09:00"]

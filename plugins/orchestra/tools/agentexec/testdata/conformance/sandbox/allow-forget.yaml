description: >
  sandbox allow / forget: user grants are stored by realpath (idempotent,
  reason kept), every refusal rule (/, home, ~/.claude, deny_read incl. the
  configured one, tamper-protected paths) exits 1 without touching the store,
  forget reports whether a grant was removed
setup:
  git: true
  files:
    .claude/orchestra.yaml: |
      sandbox:
        deny_read: [~/secrets]
    ~/data/keep.txt: "x\n"
steps:
  - argv: [sandbox, allow, ~/data]
    snapshot: ["~/.local/state/claude-orchestra/sandbox-learned.json"]
  - argv: [sandbox, allow, --json, --reason, fixtures for the tests, ~/data/sub]
  - argv: [sandbox, allow, ~/data, --json]
  - argv: [sandbox, allow, ~/new-dir/./x/.., --reason, ""]
    snapshot: ["~/.local/state/claude-orchestra/sandbox-learned.json"]
  - argv: [sandbox, allow, /]
  - argv: [sandbox, allow, "~"]
  - argv: [sandbox, allow, ~/.claude/plugins]
  - argv: [sandbox, allow, ~/.ssh/keys]
  - argv: [sandbox, allow, ~/secrets/a]
  - argv: [sandbox, allow, ~/.local/share/uv/tools/x]
  - argv: [sandbox, allow, ~/.local]
  - argv: [sandbox, allow, ~/.local/state/claude-orchestra]
  - argv: [sandbox, forget, ~/data/sub, --json]
  - argv: [sandbox, forget, ~/data/sub, --json]
  - argv: [sandbox, forget, ~/data]
  - argv: [sandbox, forget, ~/data]

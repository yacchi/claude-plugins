steps:
  - argv: [dispatch, prepare, --class, standard, --prompt-file, ja.md, --workdir, .]
    save: {JA: token}
  - argv: [dispatch, --token, "<@JA>", --summary]
    snapshot: ["~/.claude/orchestra/tokens/detach/<@JA>.answer.txt"]
  - argv: [dispatch, prepare, --class, standard, --prompt-file, emoji.md, --workdir, .]
    save: {EM: token}
  - argv: [dispatch, --token, "<@EM>", --summary, --capture]
    snapshot: ["~/.claude/orchestra/tokens/detach/<@EM>.answer.txt"]
  - argv: [dispatch, prepare, --class, standard, --prompt-file, exact.md, --workdir, .]
    save: {EX: token}
  - argv: [dispatch, --token, "<@EX>", --summary]
  - argv: [dispatch, prepare, --class, standard, --prompt-file, short.md, --workdir, .]
    save: {SH: token}
  - argv: [dispatch, --token, "<@SH>", --summary]
  - argv: [dispatch, --token, "<@SH>", --summary]
    env: {AGENT_EXEC_DRYRUN: "1"}
  - argv: [dispatch, prepare, --class, light, --prompt-file, short.md, --workdir, .]
    save: {LI: token}
  - argv: [dispatch, --token, "<@LI>", --summary]

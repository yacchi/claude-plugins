description: >
  synchronous `dispatch --token T --summary`: one compact line, `answer`
  cut to its first 400 code points (multibyte and astral characters count
  as one) with answer_truncated and the full text written to answer_path;
  an answer of exactly 400 code points is not cut; a non-JSON outcome
  (DRYRUN text) is passed through unchanged
setup:
  git: true
  fakes: [pi]
  env:
    PATH: "<HOME>/.local/bin:<ROOT>/bin:/usr/bin:/bin"
  modes:
    ~/.local/bin/agent-exec: "0755"
  files:
    ~/.local/bin/agent-exec: |
      #!/bin/sh
      exec "$AGENT_EXEC_UNDER_TEST" "$@"
    ~/.claude/settings.json: |
      {"permissions": {"allow": ["Bash(agent-exec:*)"]}}

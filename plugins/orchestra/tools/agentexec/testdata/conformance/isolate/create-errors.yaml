description: >
  usage errors of the shared create/list/diff/remove parser, task-id
  sanitizing, and the not-a-repository result
setup:
  git: true
  files:
    a.txt: "a\n"
steps:
  - argv: [isolate, create]
  - argv: [isolate, diff]
  - argv: [isolate, create, --task]
  - argv: [isolate, create, --task, t1, --bogus]
  - argv: [isolate, create, --task, t1, extra]
  - argv: [isolate, create, --task, t1, --backend, svn]
  - argv: [isolate, create, --task, t1, --session, abc]
  - argv: [isolate, diff, --task, t1, --session, abc]
  - argv: [isolate, remove]
  - argv: [isolate, remove, --task, t1, --session, abcdefgh]
  - argv: [isolate, create, --task, "///"]
  - argv: [isolate, create, --task, ".."]
  - argv: [isolate, create, --task, "../Foo Bar//x"]
  - argv: [isolate, create, --task, t1, --repo, <ROOT>/tmp]
  - argv: [isolate, diff, --task, t1, --repo, <ROOT>/tmp]
  - argv: [isolate, remove, --task, t1, --repo, <ROOT>/tmp]
  - argv: [isolate, list, --repo, <ROOT>/tmp]
  - argv: [isolate, remove, --task, nope]
  - argv: [isolate, diff, --task, nope]
  - argv: [isolate, list, --session, "bad session"]

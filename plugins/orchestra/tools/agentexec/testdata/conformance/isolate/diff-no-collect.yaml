description: >
  `diff --no-collect` reports the changed files without marking them
  collected, so remove and sweep still keep the tree; a plain diff afterwards
  does collect it (the branch tip is dated in the future so its age reads 0)
setup:
  git: true
  files:
    a.txt: "a\n"
steps:
  - argv: [isolate, create, --task, t1]
    env: {GIT_COMMITTER_DATE: "2099-01-01T00:00:00Z"}
  - argv: [isolate, list]
    env: {ORCHESTRA_ALIVE_DIR: "<ROOT>/work-orchestra/00000000-t1/scratch"}
  - argv: [isolate, diff, --task, t1, --names-only, --no-collect]
  - argv: [isolate, sweep, --dry-run, --include-current, --live-window, "0"]
  - argv: [isolate, remove, --task, t1]
  - argv: [isolate, diff, --task, t1, --names-only]
  - argv: [isolate, remove, --task, t1]

description: >
  a non-numeric choice and an out-of-range choice fall back to the default
setup:
  env:
    PATH: "<HOME>/.local/bin:<ROOT>/bin:/usr/bin:/bin"
  files:
    ~/.claude/plugins/marketplaces/mp1/plugins/orchestra/tools/agent-exec: |
      #!/bin/sh
steps:
  - argv: [install]
    stdin: "abc\n"
    go_replace: [{old: "Quick test: agent-exec list", new: "Quick test: agent-exec doctor"}]
    snapshot: ["~/.local/bin/agent-exec"]

description: >
  an existing read-only shim cannot be replaced: exit 1
setup:
  env:
    PATH: "<HOME>/.local/bin:<ROOT>/bin:/usr/bin:/bin"
  modes:
    ~/.local/bin/agent-exec: "0444"
  files:
    ~/.claude/plugins/marketplaces/mp1/plugins/orchestra/tools/agent-exec: |
      #!/bin/sh
    ~/.local/bin/agent-exec: |
      old
steps:
  - argv: [install]
    stdin: "\ny\n"
    snapshot: ["~/.local/bin/agent-exec"]

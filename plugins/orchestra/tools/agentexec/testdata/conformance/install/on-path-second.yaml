description: >
  only ~/bin is on PATH: it becomes the default
setup:
  env:
    PATH: "<HOME>/bin:<ROOT>/bin:/usr/bin:/bin"
  files:
    ~/.claude/plugins/marketplaces/mp1/plugins/orchestra/tools/agent-exec: |
      #!/bin/sh
steps:
  - argv: [install]
    stdin: "\n"
    go_replace: [{old: "Quick test: agent-exec list", new: "Quick test: agent-exec doctor"}]
    snapshot: ["~/bin/agent-exec"]

description: >
  wave lint / status / stop argument errors are exit 2; a state file that does
  not exist is exit 3
setup:
  files:
    "plan.json": |
      {}
steps:
  - argv: ["wave", "lint"]
  - argv: ["wave", "lint", "--bogus"]
  - argv: ["wave", "status"]
  - argv: ["wave", "status", "--state", "s.json"]
  - argv: ["wave", "status", "--state", "s.json", "--json"]
  - argv: ["wave", "stop"]

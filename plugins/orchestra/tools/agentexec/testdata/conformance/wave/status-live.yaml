            "at": 99999999997.5,
            "detail": "wave level need",
            "id": null,
            "kind": "environment"
          }
        ],
        "packages": {
          "a": {
            "attempts": 1,
            "commit": null,
            "detail": "working on it",
            "executor": "pi",
            "files_changed": null,
            "session": true,
            "since": 99999999993.5,
            "status": "implementing",
            "tree": "<WORK>/tree"
          },
          "b": {
            "attempts": 2,
            "commit": "deadbeef",
            "detail": "done",
            "executor": "claude",
            "files_changed": 3,
            "session": false,
            "since": 99999999994.5,
            "status": "integrated",
            "tree": null

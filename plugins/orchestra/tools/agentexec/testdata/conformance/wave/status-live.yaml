description: >
  --live counts git status lines of in-flight packages' trees (a trailing * in text), reports null when git fails there, and skips trees that do not exist
setup:
  files:
    "wave/state.json": |
      {
        "integration": {
          "base": "abc123",
          "path": "/tmp/x/int",
          "task": "wave-int"
        },
        "needs": [
          {
            "at": 99999999996.5,
            "detail": "needs wider scope\nmore detail",
            "id": "d",
            "kind": "scope"
          },

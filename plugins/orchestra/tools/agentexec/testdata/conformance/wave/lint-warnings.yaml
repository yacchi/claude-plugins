      # del
      remove everything under old
    "plan/specs/ja.md": |
      # ja
      旧実装を削除する
    "plan/plan.json": |
      {
        "rules": [
          {
            "if": "src/**",
            "require": [
              "tests/**",
              "docs/**"
            ]
          }
        ],
        "warm_read": [
          "README.md",
          "./docs/../docs/guide.md"
        ],
        "packages": [
          {
            "id": "many",
            "spec": "specs/a.md",
            "cls": "light",
            "files_owned": [
              "a.go",
              "b.go",
              "c.go",
              "d.go"
            ]
          },
          {
            "id": "long",
            "spec": "specs/long.md",
            "cls": "light",
            "files_owned": [
              "long.go"
            ]
          },
          {
            "id": "del",
            "spec": "specs/del.md",
            "cls": "light",
            "files_owned": [
              "old/a.go",
              "old/b.go"
            ]
          },
          {
            "id": "del-glob",
            "spec": "specs/del-glob.md",
            "cls": "light",
            "files_owned": [
              "old/**"
            ]
          },
          {
            "id": "ja",
            "spec": "specs/ja.md",
            "cls": "light",
            "files_owned": [
              "ja.go"
            ]
          },
          {
            "id": "rule-bad",
            "spec": "specs/a.md",
            "cls": "light",
            "files_owned": [
              "src/x.ts"
            ]
          },
          {
            "id": "rule-ok",
            "spec": "specs/b.md",
            "cls": "light",
            "files_owned": [
              "src/y.ts",
              "tests/y.test.ts"
            ]
          },
          {
            "id": "rule-partial",
            "spec": "specs/c.md",
            "cls": "light",
            "files_owned": [
              "src/**"
            ]
          }
        ]
      }
steps:
  - argv: ["wave", "lint", "--plan", "plan/plan.json"]
  - argv: ["wave", "lint", "--plan", "plan/plan.json", "--text"]
  - argv: ["wave", "lint", "--plan", "plan/plan.json", "--json"]
  - argv: ["wave", "lint", "--plan", "plan/plan.json", "--json", "--text"]

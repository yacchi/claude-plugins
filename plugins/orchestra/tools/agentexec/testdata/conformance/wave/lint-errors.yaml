description: >
  plans that fail to load are exit 3 and stderr names the problem: dependency
  cycles, unknown or duplicate ids, missing or invalid fields, missing spec
  and preamble files, malformed rules and warm_read entries, a plan without
  packages, invalid JSON, a missing plan file
setup:
  files:
    "plan/specs/a.md": |
      # a
      do the thing
    "plan/specs/b.md": |
      # b
      do the thing
    "plan/specs/c.md": |
      # c
      do the thing
    "plan/specs/d.md": |
      # d
      do the thing
    "plan/specs/e.md": |
      # e
      do the thing
    "plan/specs/f.md": |
      # f
      do the thing
    "cycle.json": |
      {
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md",
            "cls": "light",
            "depends_on": [
              "c"
            ]
          },
          {
            "id": "b",
            "spec": "plan/specs/b.md",
            "cls": "light",
            "depends_on": [
              "a"
            ]
          },
          {
            "id": "c",
            "spec": "plan/specs/c.md",
            "cls": "light",
            "depends_on": [
              "b"
            ]
          },
          {
            "id": "d",
            "spec": "plan/specs/d.md",
            "cls": "light"
          }
        ]
      }
    "self.json": |
      {
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md",
            "cls": "light",
            "depends_on": [
              "a"
            ]
          }
        ]
      }
    "missing-dep.json": |
      {
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md",
            "cls": "light",
            "depends_on": [
              "ghost"
            ]
          }
        ]
      }
    "dup.json": |
      {
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md",
            "cls": "light"
          },
          {
            "id": "a",
            "spec": "plan/specs/b.md",
            "cls": "light"
          }
        ]
      }
    "noid.json": |
      {
        "packages": [
          {
            "spec": "plan/specs/a.md",
            "cls": "light"
          }
        ]
      }
    "nospec.json": |
      {
        "packages": [
          {
            "id": "a",
            "cls": "light"
          }
        ]
      }
    "nocls.json": |
      {
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md"
          }
        ]
      }
    "badcls.json": |
      {
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md",
            "cls": "huge"
          }
        ]
      }
    "specgone.json": |
      {
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/nope.md",
            "cls": "light"
          }
        ]
      }
    "prea.json": |
      {
        "preamble": [
          "nope.md"
        ],
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md",
            "cls": "light"
          }
        ]
      }
    "rules.json": |
      {
        "rules": [
          {
            "if": "x"
          }
        ],
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md",
            "cls": "light"
          }
        ]
      }
    "rules-list.json": |
      {
        "rules": "x",
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md",
            "cls": "light"
          }
        ]
      }
    "warm-abs.json": |
      {
        "warm_read": [
          "/etc/passwd"
        ],
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md",
            "cls": "light"
          }
        ]
      }
    "warm-up.json": |
      {
        "warm_read": [
          "a/../../x"
        ],
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md",
            "cls": "light"
          }
        ]
      }
    "warm-type.json": |
      {
        "warm_read": "README.md",
        "packages": [
          {
            "id": "a",
            "spec": "plan/specs/a.md",
            "cls": "light"
          }
        ]
      }
    "nopackages.json": |
      {"rules": []}
    "list.json": |
      [1, 2]
    "broken.json": |
      {not json
steps:
  - argv: ["wave", "lint", "--plan", "cycle.json"]
    stderr_contains: ["dependency cycle: a -> c -> b -> a"]
  - argv: ["wave", "lint", "--plan", "self.json"]
    stderr_contains: ["dependency cycle: a -> a"]
  - argv: ["wave", "lint", "--plan", "missing-dep.json"]
    stderr_contains: ["ghost", "is unknown"]
  - argv: ["wave", "lint", "--plan", "dup.json"]
    stderr_contains: ["duplicate package id: a"]
  - argv: ["wave", "lint", "--plan", "noid.json"]
    stderr_contains: ["missing required field", "id"]
  - argv: ["wave", "lint", "--plan", "nospec.json"]
    stderr_contains: ["missing required field", "spec"]
  - argv: ["wave", "lint", "--plan", "nocls.json"]
    stderr_contains: ["missing required field", "cls"]
  - argv: ["wave", "lint", "--plan", "badcls.json"]
    stderr_contains: ["invalid cls", "huge"]
  - argv: ["wave", "lint", "--plan", "specgone.json"]
    stderr_contains: ["spec path does not exist"]
  - argv: ["wave", "lint", "--plan", "prea.json"]
    stderr_contains: ["preamble path does not exist"]
  - argv: ["wave", "lint", "--plan", "rules.json"]
    stderr_contains: ["rules"]
  - argv: ["wave", "lint", "--plan", "rules-list.json"]
    stderr_contains: ["rules must be a list"]
  - argv: ["wave", "lint", "--plan", "warm-abs.json"]
    stderr_contains: ["warm_read", "/etc/passwd"]
  - argv: ["wave", "lint", "--plan", "warm-up.json"]
    stderr_contains: ["warm_read", "a/../../x"]
  - argv: ["wave", "lint", "--plan", "warm-type.json"]
    stderr_contains: ["warm_read"]
  - argv: ["wave", "lint", "--plan", "nopackages.json"]
    stderr_contains: ["packages"]
  - argv: ["wave", "lint", "--plan", "list.json"]
    stderr_contains: ["packages"]
  - argv: ["wave", "lint", "--plan", "broken.json"]
    stderr_contains: ["invalid JSON in plan broken.json"]
  - argv: ["wave", "lint", "--plan", "missing.json"]
    stderr_contains: ["missing.json"]

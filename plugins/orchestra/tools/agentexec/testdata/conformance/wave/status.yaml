description: >
  wave status reads a state.json and events.jsonl in the on-disk format
  earlier versions wrote and renders them as text (default), json, or a one-
  line summary; --events adds recent events (a truncated last line is
  ignored); --live adds live change counts; a missing state file or a
  directory is exit 3. wave wait without a runner answers at once: needs
  when a need's event line is at or after --since, else the stopped state
  (with --until-change too: a gone runner wins over a change); seq counts
  complete event lines; approvals and machine ride along (machine's values
  masked)
normalize_keys: [machine]
setup:
  files:
    "wave/state.json": |
      {
        "integration": {
          "base": "abc123",
          "path": "/tmp/x/int",
          "task": "wave-int"
        },

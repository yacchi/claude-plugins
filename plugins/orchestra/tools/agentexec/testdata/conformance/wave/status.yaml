      {"at": 100000000001.5, "pkg": "f", "from": null, "to": null, "event": "custom", "detail": "free form\nsecond"}
      {"at": 100000000002.5, "pkg": "a", "ev
steps:
  - argv: ["wave", "status", "--state", "wave/state.json"]
  - argv: ["wave", "status", "--state", "wave/state.json", "--json"]
  - argv: ["wave", "status", "--state", "wave/state.json", "--line"]
  - argv: ["wave", "status", "--state", "wave/state.json", "--live"]
  - argv: ["wave", "status", "--state", "wave/state.json", "--json", "--live"]
  - argv: ["wave", "status", "--state", "wave/state.json", "--line", "--live"]
  - argv: ["wave", "status", "--state", "wave/state.json", "--events", "3"]
  - argv: ["wave", "status", "--state", "wave/state.json", "--live", "--events", "2"]
  - argv: ["wave", "status", "--state", "wave/missing.json"]
  - argv: ["wave", "status", "--state", "wave"]
  - argv: ["wave", "wait", "--state", "wave/state.json", "--max-wait", "0"]
  - argv: ["wave", "wait", "--state", "wave/state.json", "--max-wait", "0", "--since", "8"]
  - argv: ["wave", "wait", "--state", "wave/state.json", "--max-wait", "0", "--since", "6", "--until-change"]
  - argv: ["wave", "wait", "--state", "wave/state.json", "--max-wait", "-1"]

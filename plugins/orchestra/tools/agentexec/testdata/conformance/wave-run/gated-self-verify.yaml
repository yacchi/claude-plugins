description: >
  verify_mode gated: each package's tree is self-verified with
  `agent-exec check` before it may integrate (the default gate runs the
  checks over the wave). A's change stays red after one correction (the
  resumed session repeats it), so A becomes a self-verify need and its
  dependent B is blocked; C passes and integrates (exit 1)
setup:
  git: true
  fakes: [pi]
  env:
    PATH: "<HOME>/.local/bin:<ROOT>/bin:/usr/bin:/bin"
  modes:
    ~/.local/bin/agent-exec: "0755"
  files:
    ~/.local/bin/agent-exec: |
      #!/bin/sh
      exec "$AGENT_EXEC_UNDER_TEST" "$@"
    ~/.claude/settings.json: |
      {"permissions": {"allow": ["Bash(agent-exec:*)"]}}
    ~/.claude/orchestra.yaml: |
      priority:
        standard:
          default: [pi, claude]
      sandbox:
        mode: off
      interactive_host: none
      wave:
        verify_mode: gated
      checks:
        items:
          - name: nobad
            run: "! grep -rqs BAD --include=*.txt ."
    shared.txt: "base\n"
    ~/wave/specs/A.md: |
      Write a.txt.
      COMMANDS:
      printf 'BAD\n' > a.txt
    ~/wave/specs/B.md: |
      Write b.txt.
      COMMANDS:
      printf 'b\n' > b.txt
    ~/wave/specs/C.md: |
      Write c.txt.
      COMMANDS:
      printf 'c\n' > c.txt
    ~/wave/plan.json: |
      {"packages": [
         {"id": "A", "spec": "specs/A.md", "cls": "standard", "files_owned": ["a.txt"]},
         {"id": "B", "spec": "specs/B.md", "cls": "standard", "depends_on": ["A"], "files_owned": ["b.txt"]},
         {"id": "C", "spec": "specs/C.md", "cls": "standard", "files_owned": ["c.txt"]}
       ]}
normalize_keys: [since, updated, at, registered_at]
normalize_text:
  - pattern: '"(seconds|until)": ?[0-9.e+-]+'
    replace: '"$1": <N>'
steps:
  - argv: [wave, run, --plan, wave/plan.json, --state, wave/state.json, --into, wave-int, --repo, ../work, --max-in-flight, "1"]
    cwd: "~"
    snapshot: ["~/wave/state.json", "~/wave/state.events.jsonl", "~/wave/corrections/A.md"]

description: >
  wave run with the fake pi and no interactive host: three packages, B
  depending on A, one at a time (verify_mode final, no checks configured):
  every package is dispatched into its own worktree, integrated into --into
  in plan order, the run ends done (exit 0); state.json, the event log and
  wave status show the result; a second run has nothing left to do (--text)
setup:
  git: true
  fakes: [pi]
  env:
    PATH: "<HOME>/.local/bin:<ROOT>/bin:/usr/bin:/bin"
  modes:
    ~/.local/bin/agent-exec: "0755"
  files:
    ~/.local/bin/agent-exec: |
      #!/bin/sh
      exec "$AGENT_EXEC_UNDER_TEST" "$@"
    ~/.claude/settings.json: |
      {"permissions": {"allow": ["Bash(agent-exec:*)"]}}
    ~/.claude/orchestra.yaml: |
      priority:
        standard:
          default: [pi, claude]
      sandbox:
        mode: off
      interactive_host: none
    shared.txt: "base\n"
    ~/wave/preamble.md: |
      Shared preamble.
    ~/wave/specs/A.md: |
      Write a.txt.
      COMMANDS:
      printf 'a\n' > a.txt
    ~/wave/specs/B.md: |
      Write b.txt from a.txt.
      COMMANDS:
      cat a.txt > b.txt
      printf 'b\n' >> b.txt
    ~/wave/specs/C.md: |
      Write c.txt.
      COMMANDS:
      printf 'c\n' > c.txt
    ~/wave/plan.json: |
      {"preamble": ["preamble.md"],
       "packages": [
         {"id": "A", "spec": "specs/A.md", "cls": "standard", "files_owned": ["a.txt"]},
         {"id": "B", "spec": "specs/B.md", "cls": "standard", "depends_on": ["A"], "files_owned": ["b.txt"]},
         {"id": "C", "spec": "specs/C.md", "cls": "standard", "files_owned": ["c.txt"]}
       ]}
normalize_keys: [since, updated, at, registered_at]
normalize_text:
  - pattern: '"(seconds|until)": ?[0-9.e+-]+'
    replace: '"$1": <N>'
steps:
  - argv: [wave, run, --plan, wave/plan.json, --state, wave/state.json, --into, wave-int, --repo, ../work, --max-in-flight, "1"]
    cwd: "~"
    snapshot: ["~/wave/state.json", "~/wave/state.events.jsonl", "~/wave/context/B.md", "~/.claude/orchestra/waves.jsonl"]
  - argv: [wave, status, --state, wave/state.json, --json]
    cwd: "~"
  - argv: [wave, run, --plan, wave/plan.json, --state, wave/state.json, --into, wave-int, --repo, ../work, --text]
    cwd: "~"

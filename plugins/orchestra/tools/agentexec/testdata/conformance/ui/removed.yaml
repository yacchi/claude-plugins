description: >
  the local progress view is gone: ui, with or without its old options, is exit 2
  with an error pointing at the status file
steps:
  - argv: [ui]
    stderr_contains: ["agent-exec: agent-exec ui was removed: wave and plan progress is written to ~/.claude/orchestra/status.json (agent-exec status show prints it; see docs/status-file.md)"]
  - argv: [ui, --open, --json]
    stderr_contains: ["agent-exec ui was removed: "]
  - argv: [ui, --stop]
    stderr_contains: ["agent-exec ui was removed: "]

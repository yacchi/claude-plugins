description: >
  a second integrate into an existing integration tree applies on top of the
  earlier round (onto is that tree's own baseline, not the first task's);
  re-integrating an already applied task; the integration tree is refused
  by refresh, and even collected, `isolate remove` refuses it (dirty) while
  its branch is merged into no other local branch (the ignored-drift
  exemption for a merged integration tree is covered by the Go tests)
setup:
  git: true
  files:
    a.txt: "1\n2\n3\n4\n5\n6\n7\n8\n9\n"
    .gitignore: "build/\n"
    <ROOT>/prep.sh: |
      set -e
      W=<WT>
      printf '1\nTWO\n3\n4\n5\n6\n7\n8\n9\n' > $W/00000000-t1/a.txt
      printf '1\n2\n3\n4\n5\n6\n7\nEIGHT\n9\n' > $W/00000000-t2/a.txt
      printf 'new\n' > $W/00000000-t3/c.txt
    <ROOT>/build.sh: |
      mkdir -p "$INT_TREE/build"
      echo out > "$INT_TREE/build/out.txt"
  env: {PREP: "<ROOT>/prep.sh", BUILD: "<ROOT>/build.sh"}
normalize_keys: [seconds]
steps:
  - argv: [isolate, create, --task, t1]
  - argv: [isolate, create, --task, t2]
  - argv: [isolate, create, --task, t3]
  - argv: [isolate, create, --task, boot]
  - argv: [isolate, list]
    env: {ORCHESTRA_ALIVE_DIR: "<WT>/00000000-boot/hb"}
  - argv: [isolate, integrate, --tasks, boot, --into, prep, --verify, 'sh "$PREP"']
  - argv: [isolate, request, start, --into, int]
    save: {INT: integration}
  - argv: [isolate, integrate, --tasks, t1, --into, int]
  - argv: [isolate, integrate, --tasks, "t2,t3", --into, int, --onto, HEAD]
    stderr_contains: ["--onto was removed"]
    snapshot:
      - <@INT>/a.txt
      - <@INT>/c.txt
  - argv: [isolate, integrate, --tasks, t1, --into, int, --text]
  - argv: [isolate, diff, --task, int, --names-only]
  - argv: [isolate, refresh, --task, int]
  - argv: [isolate, integrate, --tasks, boot, --into, prep2, --verify, 'sh "$BUILD"']
    env: {INT_TREE: "<@INT>"}
  - argv: [isolate, collect, --task, int]
  - argv: [isolate, remove, --task, int]

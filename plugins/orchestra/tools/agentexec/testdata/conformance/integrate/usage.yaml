description: >
  integrate's usage errors (exit 2): missing and empty --tasks, a repeated
  --tasks, an unknown option, a bad --on-conflict, --bisect without --verify,
  task ids with no usable characters, an --into outside the repository; none
  of them creates a worktree
setup:
  git: true
  files:
    a.txt: "a\n"
steps:
  - argv: [isolate, integrate]
  - argv: [isolate, integrate, --tasks, " , ,"]
  - argv: [isolate, integrate, --tasks, a, --tasks, b]
  - argv: [isolate, integrate, --tasks, a, --bogus]
  - argv: [isolate, integrate, --tasks, a, --on-conflict, merge]
  - argv: [isolate, integrate, --tasks, a, --bisect]
  - argv: [isolate, integrate, --tasks, "a,//"]
  - argv: [isolate, integrate, --tasks, a, --into, "../.."]
  - argv: [isolate, list]

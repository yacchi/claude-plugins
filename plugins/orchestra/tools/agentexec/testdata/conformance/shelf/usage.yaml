description: >
  shelf's usage errors (usage text, exit 2) and the not-a-repository result
  (exit 3)
setup:
  git: true
  files:
    a.txt: "a\n"
steps:
  - argv: [shelf]
  - argv: [shelf, stash]
  - argv: [shelf, push, --bogus]
  - argv: [shelf, pop, x]
  - argv: [shelf, list, --repo, <ROOT>/tmp]
  - argv: [shelf, push, --repo, <ROOT>/tmp, --allow-main-tree]

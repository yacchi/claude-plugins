description: telemetry record is removed (exit 2 with the removal message) and run-summary rejects a missing or malformed --run
setup:
  files:
    ~/.claude/orchestra.yaml: |
      sandbox:
        mode: off
      telemetry:
        enabled: true
    bad.json: "{not json"
steps:
  - argv: [telemetry, record]
    stderr_contains: ["telemetry record was removed in orchestra 0.93.0"]
  - argv: [telemetry, record, --json, '{"event": "dispatch"}']
    stderr_contains: ["telemetry record was removed in orchestra 0.93.0"]
  - argv: [telemetry, record, --file, x]
    stderr_contains: ["telemetry record was removed in orchestra 0.93.0"]
  - argv: [telemetry, run-summary]
  - argv: [telemetry, run-summary, --run, "bad id"]

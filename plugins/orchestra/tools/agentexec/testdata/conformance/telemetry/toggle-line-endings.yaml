description: >
  CRLF, lone CR and Unicode line separators in an existing file (Python's
  text-mode read turns CRLF and CR into LF; the other separators stay)
setup:
  keep_sandbox_default: true
  files:
    ~/.claude/orchestra.yaml: "tiers:\r\n  light: sonnet\r\ntelemetry:\r\n  enabled: false  # c\r\nother: 1\r\n"
    .claude/orchestra.yaml: "tiers: {light: sonnet}\rtelemetry:\r  dir: x\rother: 1\r"
    .claude/orchestra.local.yaml: "a: 1\u2028telemetry:\u2028  enabled: false\u2028b: 2\u0085c: 3\n"
steps:
  - argv: [telemetry, enable]
    snapshot: ["~/.claude/orchestra.yaml"]
  - argv: [telemetry, enable, --scope, project]
    snapshot: [".claude/orchestra.yaml"]
  - argv: [telemetry, enable, --scope, local]
    snapshot: [".claude/orchestra.local.yaml"]

description: >
  YAML 1.1 barewords: `off`/`no` load as false and normalize per knob
  (light_class fails safe to off, the guards only turn off on an explicit
  off); `enabled: yes|on` are true; turn_edits keeps a positive int only
setup:
  files:
    ~/.claude/orchestra.yaml: |
      sandbox:
        mode: OFF
      enforcement:
        light_class: on
        worker_vcs: off
        turn_edits: 0x0C
        opus_generalist: "Off "
        session_cleanup: no
      external_executors:
        pi:
          enabled: yes
          context_files: off
      telemetry:
        enabled: on
    .claude/orchestra.yaml: |
      watchdog:
        enabled: Off
        idle_seconds: 1_200
        tool_idle_seconds: 1:30
        repeat_limit: 010
        wall_seconds:
          light: 1.5
          deep: 6.8523015e+5
          standard: .5
      orca:
        enabled: off
        permission_mode: ~
        task_timeout: 1e3
steps:
  - argv: [config]

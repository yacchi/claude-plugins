description: >
  an invalid layer is exit 1 and stderr names the file; an empty layer (or one
  holding only a comment) is an empty mapping
setup:
  files:
    .claude/orchestra.yaml: |
      tiers: [unclosed
    empty/.claude/orchestra.yaml: ""
    comment-only/.claude/orchestra.local.yaml: "# nothing here\n"
steps:
  - argv: [config]
    stderr_contains: ["agent-exec: invalid YAML in <WORK>/.claude/orchestra.yaml: "]
  - argv: [config]
    cwd: empty
  - argv: [config]
    cwd: comment-only

description: argument errors, a non-repository and a missing path
setup:
  git: true
  files:
    a.txt: "a\n"
steps:
  - argv: [check]
  - argv: [check, --task, t, --path, p]
  - argv: [check, --path, a, --path, b]
  - argv: [check, --path, a, --bogus]
  - argv: [check, --path, missing]
  - argv: [check, --path, missing, --text]
  - argv: [check, --path, ., --repo, ../tmp]

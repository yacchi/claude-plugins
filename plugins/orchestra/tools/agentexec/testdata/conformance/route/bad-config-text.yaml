description: >
  an invalid config layer is exit 1; with --text the loader's message (naming
  the file) goes to stderr
setup:
  files:
    .claude/orchestra.yaml: |
      tiers: [unclosed
steps:
  - argv: [route, --class, light, --text]
    stderr_contains: ["agent-exec: invalid YAML in <WORK>/.claude/orchestra.yaml: "]

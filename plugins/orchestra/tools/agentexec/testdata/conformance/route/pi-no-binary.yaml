description: >
  shim and permission present but no pi binary on PATH: only the binary is
  reported missing
setup:
  env:
    PATH: "<HOME>/.local/bin:<ROOT>/bin:/usr/bin:/bin"
  modes:
    ~/.local/bin/agent-exec: "0755"
  files:
    ~/.local/bin/agent-exec: |
      #!/bin/sh
      exec "/m/cache/orchestra/tools/agent-exec" "$@"
    ~/.claude/settings.json: |
      {"permissions": {"allow": ["Bash(agent-exec:*)"]}}
steps:
  - argv: [route, --class, standard]
